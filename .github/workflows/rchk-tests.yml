name: rchk-tests

# Runs rchk on R and the test packages and compares the results with
# tests/expected/<arch>. See tests/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Read test settings
        run: grep -v '^#' tests/config.sh | sed 's/\${[A-Z_]*:-\(.*\)}/\1/; s/"//g' | grep . >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: rchk-tests
          build-args: |
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            LLVM_VERSION=${{ env.LLVM_VERSION }}
            R_SVN_REVISION=${{ env.R_SVN_REVISION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Unit tests
        run: |
          mkdir -p tests/out/unit
          docker run --rm -v $PWD/tests/out/unit:/out rchk-tests /rchk/tests/unit/run-unit.sh /out
          python3 tests/unit/check.py tests/unit/rchktest/src tests/out/unit

      - name: Run rchk on R and the test packages
        if: always()
        run: |
          mkdir -p tests/out
          docker run --rm -v $PWD/tests/out:/out rchk-tests /rchk/tests/run-tests.sh /out
          python3 tests/normalize.py tests/out/raw tests/out/results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rchk-results-${{ matrix.arch }}
          path: tests/out

      - name: Compare with expected results
        if: always()
        run: tests/compare.sh tests/expected/${{ matrix.arch }} tests/out/results
